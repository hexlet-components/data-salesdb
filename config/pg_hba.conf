# TYPE  DATABASE        USER            ADDRESS                 METHOD

# The superuser is reachable from inside the container (docker exec ... psql -U postgres)
# and through an SSH tunnel to the host: published ports reach the container from
# the Docker network gateway, while outside clients keep their real address.
local   all             postgres                                peer
host    all             postgres        172.16.0.0/12           scram-sha-256
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
# Students, CloudBeaver and data-charts-api connect as the read-only student role
host    all             student         0.0.0.0/0               scram-sha-256
host    all             student         ::/0                    scram-sha-256
