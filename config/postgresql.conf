listen_addresses = '*'
password_encryption = 'scram-sha-256'

# Production runs the container with a 1.5 GB memory limit and no swap
# (role database in own-heroku). The limit also covers the 512 MB tmpfs of
# student_tmp and the 256 MB /dev/shm, so the buffers stay small.
shared_buffers = 256MB
effective_cache_size = 1GB
