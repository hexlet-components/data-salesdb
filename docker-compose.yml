services:
  postgres:
    build:
      context: .
    image: ghcr.io/hexlet-components/data-salesdb:latest
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    # Same limits as in production: temporary tables of students live in the
    # tmpfs, and the memory limit covers it together with /dev/shm.
    mem_limit: 1536m
    memswap_limit: 1536m
    shm_size: 256m
    tmpfs:
      - /var/lib/postgresql/tmp:size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
